name: R1 Demo GLB asset preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r1-demo-assets.yml'
      - 'scripts/check-demo-assets.mjs'
      - 'packages/demo-assets/glasses/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  verify-demo-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real GLB headers and browser CORS for demo manifests
        run: node scripts/check-demo-assets.mjs
      - name: Diagnose external CDN certificate after failure (read only)
        if: failure()
        shell: bash
        run: |
          echo "TLS certificate presented by cdn.visutry.com:"
          echo | openssl s_client -connect cdn.visutry.com:443 -servername cdn.visutry.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
